<head>

<meta name="robots" content="noindex, nofollow">

<title>The Degel Museum</title>
<style>
:root {
  --paper: #daeae9; --card: #ffffff; --ink: #17202d; --muted: #3f4b5d;
  --line: #b7cdcc; --accent: #0038b8;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #0e171a; --card: #152225; --ink: #e7ecf3; --muted: #a5b1c2; --line: #26383b; --accent: #6f98ff; }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 450 1.1rem/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  min-height: 100vh; display: flex; flex-direction: column; align-items: center;
  padding: 4rem 1.5rem;
}
h1 { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; font-size: 2.2rem; margin: 0 0 .4rem; }
.sub { color: var(--muted); margin: 0 0 2.6rem; max-width: 34em; text-align: center; }
.eras { display: flex; gap: 1.5rem; flex-wrap: wrap; justify-content: center; }
.era {
  display: block; width: 20rem; max-width: 100%;
  background: var(--card); border: 1px solid var(--line); border-radius: 14px;
  padding: 1.5rem; text-decoration: none; color: var(--ink);
  transition: transform .15s ease, box-shadow .15s ease;
}
.era:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(23,32,45,.15); }
.era img { display: block; max-width: 100%; height: 4rem; object-fit: contain; object-position: left; border-radius: 6px; margin-bottom: 1rem; }
.era h2 { font-family: "Iowan Old Style", Palatino, Georgia, serif; font-size: 1.3rem; margin: 0 0 .4rem; }
.era p { color: var(--muted); font-size: .95rem; margin: 0; }
.back { margin-top: 3rem; font-size: .9rem; }
.back a { color: var(--accent); text-decoration: none; }
.back a:hover { text-decoration: underline; }
</style>
</head>
