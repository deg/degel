<style>
/* ============ article pages ============
   Included only by /writing/ pages, after _style.html. Purely additive:
   every rule is scoped under .article or .article-head, so nothing here
   can reach the home page or the service pages.

   Tokens only — no new colors — so dark mode follows _style.html with no
   @media or [data-theme] block of its own.                             */

:root { --col: 41.4rem; }   /* 36em at the body's 1.15rem */
.article-head { max-width: var(--col); margin: 0 auto 2.4rem; }
.article-head h1 {
  font-size: clamp(2rem, 4.4vw, 2.9rem);
  margin: .5rem 0 .9rem;
}
.article-head .standfirst {
  font-size: 1.22rem; color: var(--muted); max-width: 34em;
}
.article-meta {
  display: flex; flex-wrap: wrap; gap: .5rem 1.1rem;
  margin-top: 1.5rem; padding-top: 1.1rem; border-top: 1px solid var(--line);
}

/* ---- prose ----
   The base resets p/h* margins to 0 and every section supplies its own
   spacing, so an article body has nothing to inherit. Restore it here.
   Measure: 36em, a shade under .lede's 38em. At the body's own 1.15rem
   that is roughly 70 characters per line — inside the 45-75 range that
   long-form prose reads best at, where 38em sits right at its edge.
   Head, body, prev/next and foot all share it so the column has ONE left
   edge — via --col rather than a repeated `36em`, because `em` resolves
   against each element's OWN font-size: the foot sets .92rem, so `36em`
   there is 530px, not 662px, and the line indented past the cards.

   CENTERED, unlike .lede and .section-head. Those sit left because the
   home page's grids fill the rest of the 68rem .wrap; an article page
   has only the one narrow column, so left-aligning it strands half the
   viewport and reads as unfinished.                                    */
.article { margin-inline: auto; max-width: var(--col); font-size: 1.15rem; line-height: 1.75; }
.article > p { margin: 0 0 1.15em; }
.article > p:last-child { margin-bottom: 0; }

.article h2 {
  font-size: clamp(1.35rem, 2.6vw, 1.62rem);
  margin: 2.5em 0 .55em;
}
.article h2:first-child { margin-top: 0; }

/* Prose links carry a color-only distinction otherwise: the base rule is
   text-decoration: none site-wide, which is right for nav and CTAs but
   not for a paragraph with ten inline links. */
.article a {
  text-decoration: underline;
  text-decoration-thickness: from-font;
  text-underline-offset: 2px;
  text-decoration-color: color-mix(in srgb, var(--accent) 42%, transparent);
}
.article a:hover { text-decoration-color: var(--accent); }

.article strong { font-weight: 650; }
.article em { font-style: italic; }

.article blockquote {
  margin: 1.6em 0; padding-left: 1.1rem;
  border-left: 3px solid var(--accent);
  font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  font-style: italic; color: var(--ink);
}
.article blockquote p { margin: 0 0 .6em; }
.article blockquote p:last-child { margin-bottom: 0; }

.article ul, .article ol { margin: 0 0 1.15em; padding-left: 1.4em; }
.article li { margin-bottom: .4em; }

/* ---- code ----
   No pre/code rules exist in _style.html at all. overflow-x is required,
   not cosmetic: the Scheme REPL transcript prints a 78-digit result, and
   without it the whole page scrolls sideways on a phone. */
.article pre {
  margin: 1.5em 0; padding: 1.05rem 1.15rem;
  background: var(--card); border: 1px solid var(--line); border-radius: 14px;
  overflow-x: auto;
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  font-size: .84rem; line-height: 1.55; color: var(--ink);
  tab-size: 2;
}
.article code {
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  font-size: .88em;
  background: var(--tint-a); border-radius: 4px; padding: .1em .34em;
}
.article pre code { background: none; padding: 0; font-size: inherit; }

/* ---- foot: previous/next, then the two standing links ---- */
.article-nav {
  margin: 3rem auto 0; max-width: var(--col); padding-top: 1.4rem;
  border-top: 1px solid var(--line);
  display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem;
}
.article-nav a {
  display: block; padding: .9rem 1.1rem;
  background: var(--card); border: 1px solid var(--line); border-radius: 14px;
  font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  font-size: 1.02rem; font-weight: 600; color: var(--ink);
  transition: border-color .15s ease;
}
.article-nav a:hover { border-color: var(--accent); color: var(--accent); }
.article-nav .dir {
  display: block; margin-bottom: .3rem;
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  font-size: .72rem; font-weight: 500; letter-spacing: .11em;
  text-transform: uppercase; color: var(--faint);
}
.article-nav .next { text-align: right; }
/* One article at each end has only a neighbour on one side; keep the other
   one in its column rather than letting it slide across. */
.article-nav .next:only-child { grid-column: 2; }
@media (max-width: 34rem) {
  .article-nav { grid-template-columns: 1fr; }
  .article-nav .next, .article-nav .next:only-child { text-align: left; grid-column: 1; }
}

.article-foot {
  margin: 1.6rem auto 0; max-width: var(--col);
  font-size: .92rem; color: var(--muted);
}
.article-foot a {
  color: var(--muted); text-decoration: underline;
  text-decoration-color: color-mix(in srgb, var(--muted) 40%, transparent);
  text-underline-offset: 3px;
}
.article-foot a:hover { color: var(--accent); text-decoration-color: var(--accent); }
.article-foot .sep { margin: 0 .6rem; color: var(--line); }

/* ---- the shared contact block, scaled for an article page ----
   _contact.html closes the home page, where a 2.7rem headline is the point.
   At the foot of an essay it shouts over the article it follows. */
.contact-compact section { padding: 3.4rem 0; }
.contact-compact .contact h2 { font-size: clamp(1.4rem, 2.6vw, 1.75rem); }
.contact-compact .contact .big-mail { font-size: clamp(1.1rem, 2vw, 1.3rem); }
.contact-compact .contact-meta { margin-top: 1.2rem; font-size: .86rem; }
</style>
